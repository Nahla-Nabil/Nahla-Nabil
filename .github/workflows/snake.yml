name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#EFF6FF,#BAE6FD,#7DD3FC,#38BDF8,#0369A1&color_snake=#0B1120
            dist/github-contribution-grid-snake-dark.svg?color_dots=#161B22,#0C4A6E,#0369A1,#38BDF8,#7DD3FC&color_snake=#E0F2FE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="40%" stop-color="#0369A1"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="24"/>
      <ellipse cx="38" cy="-9" rx="34" ry="20"/>
      <ellipse cx="-36" cy="-5" rx="30" ry="18"/>
      <ellipse cx="8" cy="11" rx="58" ry="17"/>
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#F0F9FF">
    <circle cx="70" cy="34"  r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="58" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="26" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="46" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.0s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="52" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="24" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="70" r="1.1"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- far, slow, faint clouds -->
  <g fill="#E0F2FE" opacity="0.30">
    <g transform="translate(0,60) scale(1.6)">
      <g><animateTransform attributeName="transform" type="translate" from="-320 0" to="1500 0" dur="70s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
    <g transform="translate(0,95) scale(1.3)">
      <g><animateTransform attributeName="transform" type="translate" from="900 0" to="-700 0" dur="90s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
  </g>

  <!-- mid clouds -->
  <g fill="#F0F9FF" opacity="0.55">
    <g transform="translate(0,150) scale(1.1)">
      <g><animateTransform attributeName="transform" type="translate" from="-350 0" to="1550 0" dur="48s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
    <g transform="translate(0,190) scale(0.9)">
      <g><animateTransform attributeName="transform" type="translate" from="1400 0" to="-450 0" dur="55s" begin="-8s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
  </g>

  <!-- near, fast, bright clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <g transform="translate(0,250) scale(1.35)">
      <g><animateTransform attributeName="transform" type="translate" from="-380 0" to="1600 0" dur="32s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
    <g transform="translate(0,280) scale(0.85)">
      <g><animateTransform attributeName="transform" type="translate" from="1300 0" to="-400 0" dur="38s" begin="-5s" repeatCount="indefinite"/><use href="#cloud"/></g>
    </g>
  </g>

  <!-- title -->
  <text x="600" y="150" font-family="Poppins, Verdana, sans-serif" font-size="50" font-weight="700" fill="#F8FAFC" text-anchor="middle" style="paint-order: stroke; stroke: #0B1120; stroke-width: 1px;">Nahla Nabil</text>
  <text x="600" y="185" font-family="Poppins, Verdana, sans-serif" font-size="19" fill="#E0F2FE" text-anchor="middle" opacity="0.95">AI Engineer&#160;&#8226;&#160;ML Researcher&#160;&#8226;&#160;Builder</text>
</svg>

<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Nahla Nabil — tech stack constellation</title>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0C1C33"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#cardBg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#cardGlow)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="26" fill="none" stroke="#38BDF8" stroke-opacity="0.25"/>

  <!-- twinkling background stars -->
  <g fill="#F0F9FF">
    <circle cx="30" cy="20" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="18" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="100" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="60" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="152" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="155" r="1.1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.0s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="262" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="267" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="335" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="378" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="382" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ROW 1 : Languages & Foundations -->
  <text x="60" y="56" font-family="Poppins, Verdana, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#7DD3FC">LANGUAGES &amp; FOUNDATIONS</text>

  <line x1="40" y1="107" x2="668" y2="107" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="40" cy="107" r="3" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="668" cy="107" r="3" fill="#7DD3FC" opacity="0.7"/>

  <g>
    <rect x="60" y="84" width="118" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="80" cy="107" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="98" y="113" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Python</text>
  </g>
  <g>
    <rect x="204" y="84" width="90" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="224" cy="107" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <text x="242" y="113" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">SQL</text>
  </g>
  <g>
    <rect x="320" y="84" width="112" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="340" cy="107" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="358" y="113" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">LaTeX</text>
  </g>
  <g>
    <rect x="458" y="84" width="190" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="478" cy="107" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="496" y="113" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Git &amp; GitHub</text>
  </g>

  <!-- ROW 2 : Machine Learning & Data -->
  <text x="60" y="176" font-family="Poppins, Verdana, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#7DD3FC">MACHINE LEARNING &amp; DATA</text>

  <line x1="40" y1="219" x2="1000" y2="219" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="40" cy="219" r="3" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="1000" cy="219" r="3" fill="#7DD3FC" opacity="0.7"/>

  <g>
    <rect x="60" y="196" width="132" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="80" cy="219" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" begin="0.1s" repeatCount="indefinite"/></circle>
    <text x="98" y="225" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">PyTorch</text>
  </g>
  <g>
    <rect x="218" y="196" width="168" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="238" cy="219" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
    <text x="256" y="225" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">TensorFlow</text>
  </g>
  <g>
    <rect x="412" y="196" width="190" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="432" cy="219" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="450" y="225" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">scikit-learn</text>
  </g>
  <g>
    <rect x="628" y="196" width="200" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>

    <text x="666" y="225" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Pandas &amp; NumPy</text>
  </g>
  <g>
    <rect x="854" y="196" width="126" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="874" cy="219" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    <text x="892" y="225" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Jupyter</text>
  </g>

  <!-- ROW 3 : LLM, RAG & Deployment -->
  <text x="60" y="288" font-family="Poppins, Verdana, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#7DD3FC">LLM, RAG &amp; DEPLOYMENT</text>

  <line x1="40" y1="331" x2="980" y2="331" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="40" cy="331" r="3" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="980" cy="331" r="3" fill="#7DD3FC" opacity="0.7"/>

  <g>
    <rect x="60" y="308" width="180" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="80" cy="331" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" begin="0.15s" repeatCount="indefinite"/></circle>
    <text x="98" y="337" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Hugging Face</text>
  </g>
  <g>
    <rect x="266" y="308" width="156" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="286" cy="331" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" begin="0.35s" repeatCount="indefinite"/></circle>
    <text x="304" y="337" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">LangChain</text>
  </g>
  <g>
    <rect x="448" y="308" width="232" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="468" cy="331" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.55s" repeatCount="indefinite"/></circle>
    <text x="486" y="337" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">FAISS &amp; Vector DBs</text>
  </g>
  <g>
    <rect x="706" y="308" width="118" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="726" cy="331" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text x="744" y="337" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Docker</text>
  </g>
  <g>
    <rect x="850" y="308" width="110" height="46" rx="23" fill="#0F2540" stroke="url(#chipStroke)" stroke-width="1.2"/>
    <circle cx="870" cy="331" r="4" fill="#7DD3FC"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" begin="0.95s" repeatCount="indefinite"/></circle>
    <text x="888" y="337" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Linux</text>
  </g>

  <!-- shooting stars sweeping across the whole card -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.12;0.34;0.42;1" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-40,-30; 1260,390; 1260,390" keyTimes="0;0.42;1" dur="11s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="-34" y2="-22" stroke="#F0F9FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.4" fill="#F0F9FF"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.14;0.30;0.40;1" dur="15s" begin="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="1260,-30; -40,390; -40,390" keyTimes="0;0.40;1" dur="15s" begin="6s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="34" y2="-22" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#BAE6FD"/>
  </g>
</svg>

<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>An animated AI robot waving hello</title>
  <defs>
    <linearGradient id="rHeadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12325A"/>
      <stop offset="100%" stop-color="#0E2A4E"/>
    </linearGradient>
    <linearGradient id="rBodyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2540"/>
      <stop offset="100%" stop-color="#123A63"/>
    </linearGradient>
    <linearGradient id="rStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- ground shadow (stays put while the robot bobs) -->
  <ellipse cx="150" cy="300" rx="70" ry="10" fill="#000000" opacity="0.25"/>

  <!-- twinkling accent stars -->
  <g fill="#F0F9FF">
    <circle cx="36" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="266" cy="120" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="170" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="150" y1="30" x2="150" y2="16" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
    <circle cx="150" cy="13" r="4.5" fill="#38BDF8"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>

    <!-- head -->
    <rect x="105" y="30" width="90" height="68" rx="22" fill="url(#rHeadBg)" stroke="url(#rStroke)" stroke-width="1.5"/>
    <ellipse cx="130" cy="62" rx="5" ry="6" fill="#BAE6FD"><animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.85;0.9;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="170" cy="62" rx="5" ry="6" fill="#BAE6FD"><animate attributeName="ry" values="6;6;0.6;6;6" keyTimes="0;0.85;0.9;0.95;1" dur="4.2s" repeatCount="indefinite"/></ellipse>
    <path d="M122,78 Q150,92 178,78" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round"/>

    <!-- body -->
    <rect x="93" y="98" width="114" height="96" rx="26" fill="url(#rBodyBg)" stroke="url(#rStroke)" stroke-width="1.5"/>
    <rect x="132" y="128" width="36" height="28" rx="8" fill="#0B1120" stroke="url(#rStroke)" stroke-width="1.2"/>
    <text x="150" y="148" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="15" font-weight="700" fill="#7DD3FC">AI</text>

    <!-- legs -->
    <rect x="112" y="190" width="24" height="34" rx="10" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>
    <rect x="164" y="190" width="24" height="34" rx="10" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>

    <!-- left arm (resting) -->
    <rect x="82" y="110" width="16" height="60" rx="8" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>
    <circle cx="90" cy="174" r="10" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>

    <!-- right arm (waving) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 200 110; 35 200 110; 8 200 110; 35 200 110; 0 200 110" keyTimes="0;0.25;0.5;0.75;1" dur="1.6s" repeatCount="indefinite"/>
      <rect x="202" y="50" width="16" height="60" rx="8" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>
      <circle cx="210" cy="46" r="10" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>
    </g>

    <!-- speech bubble -->
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.22;0.75;1" dur="6s" repeatCount="indefinite"/>
      <path d="M214,52 L206,62 L224,58 Z" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1"/>
      <rect x="206" y="14" width="66" height="36" rx="12" fill="#0F2540" stroke="url(#rStroke)" stroke-width="1.2"/>
      <text x="239" y="37" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="14" fill="#F0F9FF">Hi! 👋</text>
    </g>
  </g>
</svg>

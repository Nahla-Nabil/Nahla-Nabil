<svg viewBox="0 0 1200 966" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title>Nahla Nabil — about &amp; what I'm focused on right now</title>
  <defs>
    <linearGradient id="acCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0C1C33"/>
    </linearGradient>
    <radialGradient id="acCardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2540"/>
      <stop offset="100%" stop-color="#123A63"/>
    </linearGradient>
    <linearGradient id="rowB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C2038"/>
      <stop offset="100%" stop-color="#0E3258"/>
    </linearGradient>
    <linearGradient id="quoteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1C33"/>
      <stop offset="100%" stop-color="#132A4D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="966" rx="28" fill="url(#acCardBg)"/>
  <rect width="1200" height="966" rx="28" fill="url(#acCardGlow)"/>
  <rect x="1.5" y="1.5" width="1197" height="963" rx="26" fill="none" stroke="#38BDF8" stroke-opacity="0.25"/>

  <!-- twinkling stars in the margins -->
  <g fill="#F0F9FF">
    <circle cx="16" cy="60" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="300" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="540" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="16" cy="780" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.0s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1184" cy="180" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1184" cy="420" r="1.4"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1184" cy="660" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1184" cy="900" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Identity header -->
  <text x="600" y="64" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="25" font-weight="700" fill="#F8FAFC">Nahla Nabil — AI Engineer &amp; Machine Learning Researcher</text>
  <line x1="460" y1="80" x2="740" y2="80" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="600" y="106" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="15.5" fill="#E0F2FE">📍 Muharraq, Kingdom of Bahrain</text>
  <text x="600" y="132" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="15.5" fill="#E0F2FE">🎓 B.Sc. Artificial Intelligence — Arab Open University Bahrain (dual-awarded with The Open University, UK)</text>
  <text x="600" y="156" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="15.5" fill="#E0F2FE">&#183; First Class Honors &#183; Bahrain's first-ever undergraduate AI cohort</text>
  <text x="600" y="182" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="15.5" fill="#E0F2FE">📝 2 &#215; IEEE publications — ML auditing &amp; interpretability</text>

  <text x="600" y="212" text-anchor="middle" font-family="Poppins, Verdana, sans-serif" font-size="13.5" font-style="italic" fill="#7DD3FC">always building something, one experiment at a time</text>

  <!-- robot mascot -->
  <g>
    <line x1="1132" y1="40" x2="1132" y2="27" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1132" cy="24" r="4" fill="#38BDF8"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
    <rect x="1106" y="40" width="52" height="44" rx="14" fill="#12325A" stroke="url(#acStroke)" stroke-width="1.2"/>
    <ellipse cx="1122" cy="60" rx="4" ry="5" fill="#BAE6FD"><animate attributeName="ry" values="5;5;0.6;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="1142" cy="60" rx="4" ry="5" fill="#BAE6FD"><animate attributeName="ry" values="5;5;0.6;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/></ellipse>
    <line x1="1122" y1="72" x2="1142" y2="72" stroke="#7DD3FC" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Card 1 : Currently working on -->
  <rect x="40" y="248" width="1120" height="108" rx="18" fill="url(#rowA)" stroke="url(#acStroke)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="64" y="274" font-family="Poppins, Verdana, sans-serif" font-size="18">🛠️</text>
  <text x="94" y="273" font-family="Poppins, Verdana, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">CURRENTLY WORKING ON</text>
  <text x="64" y="298" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Research on conformal prediction under domain shift and LLM quantization scaling —</text>
  <text x="64" y="320" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">plus exploring how to make AI systems more interpretable and reliable.</text>

  <!-- Card 2 : Looking to collaborate on -->
  <rect x="40" y="374" width="1120" height="108" rx="18" fill="url(#rowB)" stroke="url(#acStroke)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="64" y="400" font-family="Poppins, Verdana, sans-serif" font-size="18">🤝</text>
  <text x="94" y="399" font-family="Poppins, Verdana, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">LOOKING TO COLLABORATE ON</text>
  <text x="64" y="424" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">AI safety research, LLM systems &amp; RAG pipelines, hackathons, and any project</text>
  <text x="64" y="446" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">that mixes technology with real-world impact.</text>

  <!-- Card 3 : Currently learning / exploring -->
  <rect x="40" y="500" width="1120" height="108" rx="18" fill="url(#rowA)" stroke="url(#acStroke)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="64" y="526" font-family="Poppins, Verdana, sans-serif" font-size="18">🌱</text>
  <text x="94" y="525" font-family="Poppins, Verdana, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">CURRENTLY LEARNING / EXPLORING</text>
  <text x="64" y="550" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">Explainable AI (XAI), AI alignment &amp; safety research, and how to deploy</text>
  <text x="64" y="572" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">LLM systems reliably at scale.</text>

  <!-- Card 4 : Ask me about -->
  <rect x="40" y="626" width="1120" height="88" rx="18" fill="url(#rowB)" stroke="url(#acStroke)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="64" y="652" font-family="Poppins, Verdana, sans-serif" font-size="18">💬</text>
  <text x="94" y="651" font-family="Poppins, Verdana, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">ASK ME ABOUT</text>
  <text x="64" y="676" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">RAG pipelines, LLM systems, ML interpretability, or how to get started in AI research.</text>

  <!-- Card 5 : Fun fact -->
  <rect x="40" y="732" width="1120" height="88" rx="18" fill="url(#rowA)" stroke="url(#acStroke)" stroke-opacity="0.5" stroke-width="1"/>
  <text x="64" y="758" font-family="Poppins, Verdana, sans-serif" font-size="18">⚡</text>
  <text x="94" y="757" font-family="Poppins, Verdana, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="#7DD3FC">FUN FACT</text>
  <text x="64" y="782" font-family="Poppins, Verdana, sans-serif" font-size="16" fill="#F0F9FF">I can spend hours debugging a model… and somehow still enjoy it. AI feels like my favorite puzzle 🧩</text>

  <!-- Quote strip -->
  <rect x="40" y="842" width="1120" height="90" rx="18" fill="url(#quoteBg)" stroke="url(#acStroke)" stroke-opacity="0.35" stroke-width="1"/>
  <text x="58" y="904" font-family="Georgia, serif" font-size="54" fill="#38BDF8" opacity="0.35">&#10077;</text>
  <text x="112" y="880" font-family="Poppins, Verdana, sans-serif" font-size="16.5" font-style="italic" fill="#F0F9FF">We can only see a short distance ahead, but we can see plenty there that needs to be done.</text>
  <text x="112" y="906" font-family="Poppins, Verdana, sans-serif" font-size="13" fill="#7DD3FC">— Alan Turing, 1950</text>
</svg>
